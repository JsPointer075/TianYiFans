<!-- 登录注册页面 -->
<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <title>登录注册 - 天依fans</title>

    <link rel="icon" href="assets/img/favicon.ico">
    <link rel = "stylesheet" href = "css/style.css" type = "text/css">
</head>
<body>

<form action = "天依fans.html" method = "post">
    <p>账号：<input type = "text" name = "username" minlength = "11" maxlength="11" placeholder = "请输入手机号"></p>
    <p>密码：<input type = "password" name = "pwd" minlength = "6" placeholder = "请输入密码"></p>
    <p>性别：
        <input type = "radio" value = "boy" name = "sex" id = "man"><label for = "man">男</label>
        <input type = "radio" value = "girl" name = "sex" id = "woman"><label for = "woman">女</label>
    </p>
    <p>喜欢的虚拟歌手：
        <input type = "checkbox" value = "cywl" name = "Vsinger" id = "miku"><label for = "miku">初音未来</label>
        <input type = "checkbox" value = "lty" name = "Vsinger" id = "lty"><label for = "lty">洛天依</label>
        <input type = "checkbox" value = "yzl" name = "Vsinger" id = "yzl"><label for = "yzl">乐正绫</label>
        <input type = "checkbox" value = "yh" name = "Vsinger" id = "yh"><label for = "yh">言和</label>
        <input type = "checkbox" value = "xc" name = "Vsinger" id = "xc"><label for = "xc">星尘</label>
    </p>
    <p>国家：
        <select name = "国家">
            <option value = "china">中国</option>
            <option value = "japan">日本</option>
            <option value = "us">美国</option>
        </select>
    </p>
    <p>反馈：
        <textarea name = "textarea"></textarea>
    </p>
    <p>
        <input type = "submit">
        <input type = "reset">
        <a href = "index.html"><input type = "button" name = btln value = "返回"></a>
    </p>
</form>

</body>
</html>
